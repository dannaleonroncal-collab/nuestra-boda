
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danna y Sebastian | Nuestra boda</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: #fff;
      color: #242424;
      font-family: Arial, sans-serif;
      line-height: 1.65;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 38px;
      line-height: 1.2;
      margin: 24px 0;
    }

    .intro { color: #555; }

    hr {
      border: 0;
      border-top: 1px solid #e8e8e8;
      margin: 30px 0;
    }

    .bank {
      font-size: 13px;
      letter-spacing: 1.5px;
    }

    .label {
      color: #666;
      font-size: 13px;
      margin: 18px 0 4px;
    }

    .names {
      font-family: Georgia, serif;
      font-size: 23px;
    }

    .value {
      font-size: 17px;
      overflow-wrap: anywhere;
      margin: 0;
    }

    .footer {
      color: #666;
      font-family: Georgia, serif;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Nuestra boda</p>

    <h1>Gracias por ser parte de nuestra historia</h1>

    <p class="intro">
      Gracias por acompañarnos en este día tan especial.
    </p>

    <hr>

    <div class="bank">BCP · Banco de Crédito del Perú</div>

    <p class="label">Titulares</p>
    <p class="names">Danna y Sebastian</p>

    <p class="label">Número de cuenta</p>
    <p class="value">19116826235095</p>

    <p class="label">CCI</p>
    <p class="value">00219111682623509556</p>

    <hr>

    <p class="footer">Con cariño, Danna y Sebastian.</p>
  </main>
</body>
</html>
